<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loadout Randomizer</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, sans-serif;
      background: #141719;
      color: #f4f5f2;
    }

    body { margin: 0; }

    main {
      max-width: 46rem;
      margin-inline: auto;
      padding: clamp(1rem, 5vw, 3rem);
    }

    header {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      margin-bottom: 1.5rem;
    }

    h1 { margin: 0; font-size: clamp(1.75rem, 5vw, 2.5rem); }

    button {
      padding: .7rem 1rem;
      border: 0;
      border-radius: .35rem;
      background: #e8d94f;
      color: #141719;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover { background: #fff078; }

    button:focus-visible,
    a:focus-visible { outline: 2px solid white; outline-offset: 4px; }

    #loadout {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: .75rem;
    }

    section {
      padding: 1rem 1.15rem;
      border: 1px solid #3c4449;
      border-radius: .5rem;
      background: #1e2326;
      overflow-wrap: anywhere;
    }

    section:last-child { grid-column: 1 / -1; }
    h2 { margin: 0 0 .55rem; color: #e8d94f; font-size: .95rem; }

    .equipment-image {
      display: block;
      border-radius: .3rem;
      background: #171b1d;
    }

    .equipment-image img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }

    #primary .equipment-image,
    #armour .equipment-image { height: 9rem; }

    .equipment-name { margin: .65rem 0 .45rem; font-weight: 700; }

    dl { margin: 0; color: #d0d7d9; }
    dl div { display: flex; flex-wrap: wrap; gap: .15rem .55rem; margin-top: .2rem; }
    dt { font-weight: 600; }
    dd { margin: 0; }

    #stratagems {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: .55rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    #stratagems li {
      display: grid;
      grid-template-rows: auto 1fr;
      justify-items: center;
      gap: .55rem;
      padding: .7rem .4rem;
      border: 1px solid #3c4449;
      border-radius: .35rem;
      line-height: 1.35;
      text-align: center;
    }

    #stratagems .equipment-image { width: 3.25rem; height: 3.25rem; }

    .credits { margin: .85rem 0 0; color: #b8c3c5; font-size: .875rem; }
    .credits a { color: inherit; }

    @media (max-width: 32rem) {
      #loadout { grid-template-columns: 1fr; }
      #stratagems { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Loadout Randomizer</h1>
      <button type="button" id="roll">Randomize</button>
    </header>
    <div id="loadout" aria-live="polite" aria-atomic="true">
      <section aria-labelledby="primary-heading">
        <h2 id="primary-heading">Primary</h2>
        <div id="primary"></div>
      </section>
      <section aria-labelledby="armour-heading">
        <h2 id="armour-heading">Armour</h2>
        <div id="armour"></div>
      </section>
      <section aria-labelledby="stratagems-heading">
        <h2 id="stratagems-heading">Stratagems</h2>
        <ul id="stratagems"></ul>
      </section>
    </div>
    <p class="credits">Images and item data from the <a href="https://helldivers.wiki.gg/">Helldivers Wiki</a>.</p>
    <noscript>Enable JavaScript to roll a loadout.</noscript>
  </main>

    const wikiImages = "https://helldivers.wiki.gg/images/";
    const primaryResult = document.getElementById("primary");
    const armourResult = document.getElementById("armour");
    const stratagemResults = document.getElementById("stratagems");

    const randomWord = new Uint32Array(1);
    const randomWordRange = 2 ** 32;

    function randomIndex(length) {
      // Discard the tail so every index has the same number of possible draws.
      const limit = randomWordRange - (randomWordRange % length);
      do {
        crypto.getRandomValues(randomWord);
      } while (randomWord[0] >= limit);

      return randomWord[0] % length;
    }

    function imageLink(item) {
      const link = document.createElement("a");
      link.className = "equipment-image";
      link.href = wikiImages + item.image;
      link.target = "_blank";
      link.rel = "noopener noreferrer";
      link.setAttribute("aria-label", "Open image of " + item.name + " in a new tab");

      const image = document.createElement("img");
      image.alt = "";
      image.decoding = "async";
      image.loading = "lazy";
      image.src = link.href;
      link.append(image);
      return link;
    }

    function detail(label, value) {
      const term = document.createElement("dt");
      term.textContent = label;
      const description = document.createElement("dd");
      description.textContent = value;
      const row = document.createElement("div");
      row.append(term, description);
      return row;
    }

    function showGear(target, item) {
      const name = document.createElement("p");
      name.className = "equipment-name";
      name.textContent = item.name;

      const details = document.createElement("dl");
      details.append(detail(item.warbond ? "Warbond" : "Source", item.warbond ?? item.source));
      if (item.perk) details.append(detail("Perk", item.perk));
      target.replaceChildren(imageLink(item), name, details);
    }

    function rollLoadout() {
      showGear(primaryResult, primaries[randomIndex(primaries.length)]);
      showGear(armourResult, armour[randomIndex(armour.length)]);

      const availableGroups = Object.values(stratagemGroups).map(group => [...group]);
      const results = [];
      for (let slot = 0; slot < 4; slot += 1) {
        // Pick the colour first so pool size does not affect its odds.
        const group = availableGroups[randomIndex(availableGroups.length)];
        const [stratagem] = group.splice(randomIndex(group.length), 1);
        const item = document.createElement("li");
        const name = document.createElement("span");
        name.textContent = stratagem.name;
        item.append(imageLink(stratagem), name);
        results.push(item);
      }
      stratagemResults.replaceChildren(...results);
    }

    document.getElementById("roll").addEventListener("click", rollLoadout);
    rollLoadout();
  </script>
